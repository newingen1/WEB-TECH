<!DOCTYPE html>
<html>
<head>
    <title>Book Donor Registration</title>
	<link rel="stylesheet" href="style.css">
	<script src="jsvalidation.js"></script>
    
</head>
<body>
    <h1 id="page-title">Book Donor / Book Owner Registration</h1>
	
	<div class="form-container">
		<p>Register to donate books or make your books available to others.</p>

    
<form id="donorForm" novalidate>

    <table>

        <tr>
            <td>Full Name:</td>
            <td>
                <input type="text" id="fullname" name="fullname">
                <span id="nameError"></span>
            </td>
        </tr>

        <tr>
            <td>Email:</td>
            <td>
                <input type="email" id="email" name="email">
                <span id="emailError"></span>
            </td>
        </tr>

        <tr>
            <td>Password:</td>
            <td>
                <input type="password" id="password" name="password">
                <span id="passwordError"></span>
            </td>
        </tr>

        <tr>
            <td>Confirm Password:</td>
            <td>
                <input type="password" id="confirmPassword" name="confirmPassword">
                <span id="confirmError"></span>
            </td>
        </tr>

        <tr>
            <td>Phone Number:</td>
            <td>
                <input type="tel" id="phone" name="phone">
                <span id="phoneError"></span>
            </td>
        </tr>

        <tr>
            <td>Address:</td>
            <td>
                <input type="text" id="address" name="address">
                <span id="addressError"></span>
            </td>
        </tr>

        <tr>
            <td>Book Title:</td>
            <td>
                <input type="text" id="booktitle" name="booktitle">
                <span id="bookError"></span>
            </td>
        </tr>

        <tr>
            <td>Book Category:</td>
            <td>
                <select id="category" name="category">
                    <option value="">Select Category</option>
                    <option value="Academic">Academic</option>
                    <option value="Story">Story</option>
                    <option value="Science">Science</option>
                    <option value="Technology">Technology</option>
                    <option value="Other">Other</option>
                </select>
                <span id="categoryError"></span>
            </td>
        </tr>

        <tr>
            <td>Book Condition:</td>
            <td>
                <input type="radio" name="condition" value="new"> New
                <input type="radio" name="condition" value="used"> Used
                <span id="conditionError"></span>
            </td>
        </tr>

        <tr>
            <td>Purpose:</td>
            <td>
                <input type="checkbox" name="purpose" value="donate"> Donate
                <input type="checkbox" name="purpose" value="share"> Share
                <span id="purposeError"></span>
            </td>
        </tr>

        <tr>
            <td>Additional Information:</td>
            <td>
                <textarea name="information" rows="4" cols="25"></textarea>
            </td>
        </tr>

        <tr>
            <td></td>
            <td>
                <input type="submit" value="Register">
            </td>
        </tr>

    </table>

    <p id="successMessage"></p>

</form>

	</div>

</body>
</html>
